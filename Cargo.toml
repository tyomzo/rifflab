[workspace]
members = [
    "crates/rifflab-core",
    "crates/rifflab-audio",
    "crates/rifflab-fx",
    "crates/rifflab-ipc",
    "crates/rifflab-stems",
    "crates/rifflab-analysis",
    "crates/rifflab-practice",
    "crates/rifflab-ui",
    "crates/rifflab-app",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rmp-serde = "1"
rtrb = "0.3"
log = "0.4"
env_logger = "0.11"
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }

# Internal crates
rifflab-core = { path = "crates/rifflab-core" }
rifflab-audio = { path = "crates/rifflab-audio" }
rifflab-fx = { path = "crates/rifflab-fx" }
rifflab-ipc = { path = "crates/rifflab-ipc" }
rifflab-stems = { path = "crates/rifflab-stems" }
rifflab-analysis = { path = "crates/rifflab-analysis" }
rifflab-practice = { path = "crates/rifflab-practice" }
rifflab-ui = { path = "crates/rifflab-ui" }
